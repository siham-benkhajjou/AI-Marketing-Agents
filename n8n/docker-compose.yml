services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: n8n_user
      POSTGRES_PASSWORD: change_me_strong_password
      POSTGRES_DB: newsletter_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Africa/Casablanca
      - TZ=Africa/Casablanca
      # Allow the "Read/Write Files from Disk" node to read the project assets
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
    volumes:
      - n8n_data:/home/node/.n8n
      # Project assets (logo, ...) : ./n8n-files on your PC  ->  /files inside n8n
      - ./n8n-files:/files
    depends_on:
      - postgres

volumes:
  n8n_data:
    external: true
  postgres_data:
